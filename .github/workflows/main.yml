name: Build APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build
        run: |
          set -e
          echo "--- repo files ---"; find . -maxdepth 3 -not -path './.git/*' | head -40
          PKG=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          [ -n "$PKG" ] || { echo "ERROR: ไม่พบ package.json ใน repo — อัปโหลดไฟล์จากซิปไม่ครบ"; exit 1; }
          cd "$(dirname "$PKG")"; pwd; ls
          [ -f www/index.html ] || { echo "ERROR: ไม่พบ www/index.html"; exit 1; }
          npm install
          npx cap add android
          f=android/app/src/main/AndroidManifest.xml
          for p in INTERNET ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CAMERA; do
            grep -q "android.permission.$p" $f || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $f
          done
          npm run build:android
          echo "APKDIR=$(pwd)" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: cabby-drivers-apk, path: "${{ env.APKDIR }}/android/app/build/outputs/apk/debug/app-debug.apk" }
